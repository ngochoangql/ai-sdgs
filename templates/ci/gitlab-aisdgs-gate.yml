# AI-SDGS Ring 3 Out-of-Band GitLab CI Governance Gate (STD-009-R08, STD-012-R03, DEC-007)
aisdgs_governance_gate:
  stage: test
  image: node:24-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - aisdgs standard verify-lock
    - aisdgs validate --strict
    - aisdgs baseline verify
    - aisdgs report --format json --output ci-compliance-posture.json
  artifacts:
    when: always
    paths:
      - ci-compliance-posture.json
